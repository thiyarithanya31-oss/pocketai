<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewelry Planner - PocketSmart AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-gray-50 min-h-screen">
    
    <nav class="bg-yellow-600 text-white p-4 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">PocketSmart AI</h1>
            <a href="/dashboard" class="hover:underline">Back to Dashboard</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-6 mt-6">
        <div class="bg-white rounded-lg shadow-lg p-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Jewelry Budget Planner</h2>
            
            <form id="jewelryForm" class="space-y-6">
                <div>
                    <h3 class="text-lg font-semibold text-gray-700 mb-2">1. Budget Details</h3>
                    <label class="block text-sm font-medium text-gray-600">Total Budget (₹)</label>
                    <input type="number" name="budget" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-yellow-500 focus:border-yellow-500" placeholder="e.g. 150000">
                </div>

                <div>
                    <h3 class="text-lg font-semibold text-gray-700 mb-2">2. Preferences</h3>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Jewelry Style/Type</label>
                        <input type="text" name="style" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-yellow-500 focus:border-yellow-500" placeholder="e.g. Bridal Gold, Diamond Necklace, Minimalist Silver">
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-yellow-600 text-white font-bold py-3 px-4 rounded hover:bg-yellow-700 transition">
                    Generate Jewelry Plan
                </button>
            </form>

            <div id="loading" class="hidden mt-6 text-center text-gray-600">
                <p>Analyzing budget and fetching AI recommendations...</p>
            </div>

            <div id="results" class="hidden mt-8 space-y-6">
                <!-- AI Results injected here -->
            </div>
        </div>
    </main>

    <script>
        document.getElementById('jewelryForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50');
            loading.classList.remove('hidden');
            results.classList.add('hidden');
            results.innerHTML = '';

            const formData = new FormData(e.target);

            try {
                const response = await fetch('/generate-jewelry', {
                    method: 'POST',
                    body: formData,
                    credentials: 'same-origin'
                });

                if (response.status === 401) {
                    alert("Your session has expired. Please log in again.");
                    window.location.href = "/login";
                    return;
                }

                if (!response.ok) throw new Error("Error fetching recommendations.");

                const data = await response.json();
                
                results.innerHTML = `
                    <div class="p-4 bg-yellow-50 border border-yellow-200 rounded-md">
                        <h3 class="text-xl font-bold text-yellow-800 mb-2">AI Plan Generated Successfully!</h3>
                        <pre class="bg-white p-4 rounded border text-sm text-gray-700 overflow-x-auto whitespace-pre-wrap">${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
                results.classList.remove('hidden');
            } catch (error) {
                alert(error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50');
                loading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
